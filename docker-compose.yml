# Docker Compose for EXL3 models served via TabbyAPI (ExllamaV3 backend).

services:
  tabbyapi:
    container_name: EXL3
    build: .
    image: ghcr.io/theroyallab/tabbyapi:latest
    env_file:
      - .env
    restart: "${RESTART_POLICY:-no}"

    runtime: nvidia

    cap_add:
      - IPC_LOCK
      - SYS_NICE
    ulimits:
      memlock:
        soft: -1
        hard: -1

    command: >-
      main.py

    volumes:
      - ./models:/app/models 
      - ./config.yml:/app/config.yml               

    ports:
      - "${HOST_PORT:-11966}:5000" # update to whatever port you want to expose.

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:${API_PORT:-5000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: "${HEALTHCHECK_START_PERIOD:-60s}"


# modifying config.yml is the prefered way to change settings
# usage: main.py -h
