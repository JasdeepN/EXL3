# TabbyAPI startup configuration for EXL3 model serving 

model:
  model_dir: /app/models
  model_name: Qwen3.8-27B-exl3
  max_seq_len: 131072
  cache_size: 131072
  cache_mode: 4,4
  mem_fraction_static: 0.75
  tensor_parallel_size: 1
  seed: 42
  inline_model_loading: false
  cpu_moe_offload_layers: 999
  tool_format: qwen3_5
  vision: false
  output_chunking: true

## Options for draft models (speculative decoding)
