## Global memory settings
memory:
 sysmem_recurrent_cache: 4096
 sysmem_kv_cache: 8192
 # cuda_maloc_async: false

# Options for networking
network:
  host: 0.0.0.0
  port: 5000
  disable_auth: true
  api_servers: ["OAI"]
